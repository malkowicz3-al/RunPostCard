<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#1f2328">Where to find the two values (schematic)</text>

  <g font-size="15" fill="#1f2328">
    <text x="40" y="110" fill="#444">Client ID</text>
    <rect x="200" y="90" width="200" height="34" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="214" y="113" font-family="Consolas, monospace">123456</text>
    <text x="420" y="113" fill="#fc4c02" font-weight="600">&#8592; copy this to VITE_STRAVA_CLIENT_ID (public)</text>

    <text x="40" y="180" fill="#444">Client secret</text>
    <rect x="200" y="160" width="200" height="34" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="214" y="183" font-family="Consolas, monospace">********</text>
    <rect x="420" y="160" width="80" height="34" rx="6" fill="#fc4c02"/>
    <text x="460" y="183" fill="#fff" text-anchor="middle" font-weight="600">Show</text>
    <text x="520" y="183" fill="#fc4c02" font-weight="600">&#8592; click Show, then copy</text>
    <text x="40" y="214" font-size="13" fill="#57606a">Keep it secret. Do not paste it in chat, in issues, or commit it.</text>
  </g>

  <rect x="40" y="250" width="720" height="150" rx="8" fill="#fff8f0" stroke="#fc4c02"/>
  <text x="60" y="280" font-size="14" font-weight="700" fill="#cf222e">Do NOT use the "Your access token" section</text>
  <text x="60" y="306" font-size="13" fill="#1f2328">That token is for your own account only and is not needed by the app.</text>
  <text x="60" y="330" font-size="13" fill="#1f2328">The login button in the app obtains a token for you automatically.</text>
  <text x="60" y="354" font-size="13" fill="#1f2328">If you regenerate the client secret, update .env and restart the dev server.</text>
</svg>
