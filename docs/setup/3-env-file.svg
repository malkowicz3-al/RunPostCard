<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#1f2328">Your .env file (schematic)</text>
  <text x="40" y="78" font-size="14" fill="#57606a">Create it in the project root (next to package.json) by copying .env.example.</text>

  <rect x="40" y="100" width="720" height="130" rx="8" fill="#0d1117"/>
  <g font-family="Consolas, monospace" font-size="16">
    <text x="64" y="144" fill="#7ee787">VITE_STRAVA_CLIENT_ID=<tspan fill="#ffa657">your-client-id</tspan></text>
    <text x="64" y="174" fill="#7ee787">STRAVA_CLIENT_SECRET=<tspan fill="#ffa657">paste-your-secret-here</tspan></text>
    <text x="64" y="204" fill="#7ee787">VITE_CARTO_API_KEY=<tspan fill="#8b949e">  (optional, can stay empty)</tspan></text>
  </g>

  <g font-size="14" fill="#1f2328">
    <text x="40" y="270" font-weight="600">Rules</text>
    <text x="40" y="294">No spaces around the = sign. No quotes. Save the file, then restart npm run dev.</text>
  </g>
</svg>
